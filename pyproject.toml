[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-travel-concierge-agentops"
version = "2.0.0"
description = "Enterprise Corporate Travel & Expense Concierge built with Google ADK, Vertex AI Agent Engine, Vertex AI Search, Memory Bank, A2A Protocol, and OpenTelemetry."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.0.0",
    "google-genai>=1.0.0",
    "google-cloud-aiplatform>=1.70.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-dlp>=3.20.0",
    "google-cloud-logging>=3.10.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
